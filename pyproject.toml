[project]
name = "hybridai-h1"
version = "0.1.0"
description = "Hybrid AI H1 session — tooling built on the FrameX frame-logic engine"
readme = "README.md"
requires-python = ">=3.10"
# The FrameX core client is intentionally dependency-free; reasoning happens in
# the `framex` Rust binary, not in Python.
dependencies = [
    "requests>=2.34.2",
]

[project.optional-dependencies]
# framex.torch wraps the engine's `dual` command as an autograd Function.
torch = ["torch>=2.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Application packages live under src/; hatchling strips that prefix.
packages = ["framex", "src/cli", "src/data", "src/ontology", "src/runtime"]
